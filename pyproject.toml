[project]
name = "shaply"
version = "1.0.0"
description = "Usual SHAP explainability figures rendered as interactive Plotly charts."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "antoine126", email = "antoine.pagneux@neuf.fr" },
]
keywords = ["shap", "shapley", "plotly", "explainability", "xai", "machine-learning"]
requires-python = ">=3.12.7"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "plotly>=5.20",
    "pydantic>=2.6",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

# Everything needed to run the example notebook in `examples/`.
examples = [
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "shap>=0.45",
    "ipykernel>=6.29",
    "nbformat>=5.9",
]

[project.urls]
Homepage = "https://github.com/antoine126/shaply"
Repository = "https://github.com/antoine126/shaply"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "nbconvert>=7.16",
    "pandas>=2.0",
    "pandas-stubs>=2.0",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shaply"
module-root = "src"

# ------------------------------------------------------------------------------
# Ruff
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
]
ignore = [
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__
    "ANN401",  # dynamically typed *args/**kwargs allowed where needed
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "ANN", "TC001", "TC002", "TC003"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["shaply"]

# ------------------------------------------------------------------------------
# mypy
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

# ------------------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=shaply --cov-report=term-missing"
testpaths = ["tests"]

# ------------------------------------------------------------------------------
# coverage
# ------------------------------------------------------------------------------
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
